stages:
  validate:
    cmd: python src/validate.py
    deps:
      - data/raw/tetouan.zip
      - src/validate.py
      - src/schema.py
    params:
      - data.raw_zip
      - data.clean_csv
    outs:
      - data/interim/clean.csv
    metrics:
      - reports/data_validation.json:
          cache: false

  features:
    cmd: python src/features.py
    deps:
      - data/interim/clean.csv
      - src/features.py
      - src/schema.py
    params:
      - protocol
      - target
      - data.processed_dir
    outs:
      - data/processed
    metrics:
      - reports/data_stats.json:
          cache: false

  train:
    cmd: python src/train.py
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - reports/data_stats.json
      - src/train.py
      - src/features.py
    params:
      - train
      - mlflow
    outs:
      - models
    metrics:
      - reports/metrics.json:
          cache: false
