data:
  raw_zip: "data/raw/tetouan.zip"
  clean_csv: "data/interim/clean.csv"
  processed_dir: "data/processed"

# decoupage temporel (voir docs/01_cadrage.md)
protocol:
  train_start: "2017-01-01"
  train_end: "2017-04-30"
  test_start: "2017-05-01"
  test_end: "2017-05-31"
  production_start: "2017-06-01"

target:
  horizon_steps: 6      # 6 x 10 min = 1h
  peak_quantile: 0.90

train:
  val_days: 21          # les 3 dernieres semaines du train servent a choisir le modele et le seuil
  cost_fn: 5            # cout d'un pic rate
  cost_fp: 1            # cout d'une fausse alerte
  random_state: 42
  logreg:
    C: 1.0
  hgb:
    max_iter: 300
    learning_rate: 0.05
    max_depth: 6

mlflow:
  tracking_uri: "http://localhost:5000"   # serveur MLflow lance avec docker compose
  experiment: "tetouan-pics"
  model_name: "tetouan-pics-model"

# criteres d'acceptation (fixes a l'etape 1, voir docs/01_cadrage.md)
gate:
  min_recall: 0.85
  min_precision: 0.50
  min_pr_auc: 0.80
  min_recall_weekend: 0.75   # le modele ne doit pas s'effondrer sur un sous-groupe
  max_latency_ms: 50
